<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>登录 · 小账本</title>
<meta name="description" content="小账本 · 登录" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#F6F6F4" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0B0B0D" media="(prefers-color-scheme: dark)" />
<meta name="color-scheme" content="light dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="小账本" />
<meta name="application-name" content="小账本" />
<meta name="format-detection" content="telephone=no" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<script>
  // 首帧前应用主题，避免深色模式闪白
  (function(){try{var p=localStorage.getItem('xzb-theme')||'auto';var d=p==='dark'||(p==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';}catch(e){}})();
</script>
</head>
<body>
<main class="login" id="login">
  <img class="logo" src="/icons/icon-192.png" alt="" width="72" height="72" />
  <h1>小账本</h1>
  <p class="sub" id="sub">登录以访问你的账本</p>
  <p class="notice" id="notice" role="status" hidden></p>
  <form id="form" novalidate>
    <label class="field"><span>邮箱</span><input id="email" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" maxlength="254" required /></label>
    <label class="field"><span>密码</span><input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required /></label>
    <label class="field" id="pw2Row" hidden><span>再次输入密码</span><input id="password2" type="password" autocomplete="new-password" maxlength="256" /></label>
    <p class="err" id="err" role="alert" hidden></p>
    <button class="btn" id="submit" type="submit">登录</button>
  </form>
  <button class="link" id="toggle" type="button" hidden>没有账号？注册</button>
  <p class="foot" id="foot">账号由管理员在服务器上创建<br/>忘记密码请在服务器上用命令重置</p>
</main>
<script type="module" src="/src/login/login.ts"></script>
</body>
</html>
