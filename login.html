<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>登录 · 小账本</title>
<meta name="description" content="小账本 · 登录" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#F6F6F4" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0B0B0D" media="(prefers-color-scheme: dark)" />
<meta name="color-scheme" content="light dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="小账本" />
<meta name="application-name" content="小账本" />
<meta name="format-detection" content="telephone=no" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<script>
  // 首帧前应用主题，避免深色模式闪白
  (function(){try{var p=localStorage.getItem('xzb-theme')||'auto';var d=p==='dark'||(p==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';}catch(e){}})();
</script>
</head>
<body>
<div class="bg" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="grid"></i></div>
<main class="login" id="login">
  <header class="brand">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 64 64"><defs><linearGradient id="mk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7B7BEA"/><stop offset=".55" stop-color="#5B5BD6"/><stop offset="1" stop-color="#4A43C4"/></linearGradient><radialGradient id="mh" cx=".28" cy="0" r="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
        <rect width="64" height="64" rx="18" fill="url(#mk)"/><rect width="64" height="64" rx="18" fill="url(#mh)"/>
        <g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="19" y="16" width="26" height="32" rx="5.5"/><path d="M25.5 25h13M25.5 32h13M25.5 39h7.5"/></g></svg>
    </div>
    <h1>小账本</h1>
    <p class="slogan">安静记账，看清每一笔</p>
  </header>

  <section class="card" id="card">
    <div class="card-h"><h2 id="sub">登录以访问你的账本</h2></div>
    <p class="notice" id="notice" role="status" hidden></p>
    <form id="form" novalidate>
      <label class="field"><span class="lb">邮箱</span>
        <span class="ctl"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
        <input id="email" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" maxlength="254" placeholder="name@example.com" required /></span></label>
      <label class="field"><span class="lb">密码</span>
        <span class="ctl"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" placeholder="输入密码" required />
        <button class="eye" type="button" data-for="password" aria-label="显示密码" aria-pressed="false"><svg class="i on" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg class="i off" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 5.1A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-2.2 3.1M6.6 6.6A16.5 16.5 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18"/></svg></button></span></label>
      <label class="field" id="pw2Row" hidden><span class="lb">再次输入密码</span>
        <span class="ctl"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="m9.5 15.5 1.8 1.8 3.4-3.4"/></svg>
        <input id="password2" type="password" autocomplete="new-password" maxlength="256" placeholder="再次输入密码" /></span></label>
      <p class="err" id="err" role="alert" hidden></p>
      <button class="btn" id="submit" type="submit"><span class="spin" aria-hidden="true"></span><span class="lbl" id="submitLbl">登录</span><svg class="i arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </form>
    <button class="link" id="toggle" type="button" hidden>没有账号？注册</button>
  </section>

  <footer class="foot-wrap">
    <p class="trust"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 3 8.3 7 9.5 4-1.2 7-5 7-9.5V6Z"/><path d="m9 12 2 2 4-4"/></svg>数据加密传输 · 离线可用</p>
    <p class="foot" id="foot">账号由管理员在服务器上创建<br/>忘记密码请在服务器上用命令重置</p>
  </footer>
</main>
<script type="module" src="/src/login/login.ts"></script>
</body>
</html>
