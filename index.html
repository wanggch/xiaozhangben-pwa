<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>小账本</title>
<meta name="description" content="小账本 · 极简、安静的离线记账 App。多账本、多账户、预算、周期账单、日历与统计，数据只保存在你的设备上。" />
<meta name="theme-color" content="#F6F6F4" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0B0B0D" media="(prefers-color-scheme: dark)" />
<meta name="color-scheme" content="light dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="小账本" />
<meta name="application-name" content="小账本" />
<meta name="format-detection" content="telephone=no" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<script>
  // 首帧前应用主题，避免深色模式闪白
  (function(){try{var p=localStorage.getItem('xzb-theme')||'auto';var d=p==='dark'||(p==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';}catch(e){}})();
</script>
<style>#app.booting{opacity:0}#app{transition:opacity .25s}</style>
</head>
<body>
<div id="app" class="booting">
  <div class="root" id="root">
    <main class="pages">
      <section class="page active" id="p-home" aria-label="账单"></section>
      <section class="page" id="p-stats" aria-label="统计" inert></section>
      <section class="page" id="p-assets" aria-label="资产" inert></section>
      <section class="page" id="p-me" aria-label="我的" inert></section>
    </main>
    <nav class="tabbar" id="tabbar" aria-label="主导航">
      <button class="tab on" data-tab="home" aria-current="page"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>账单</button>
      <button class="tab" data-tab="stats"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.2 15.9A10 10 0 1 1 8 2.8"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>统计</button>
      <div class="fab-slot"><button class="fab" id="fab" aria-label="记一笔"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button></div>
      <button class="tab" data-tab="assets"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12V8H6a2 2 0 0 1 0-4h12v4"/><path d="M4 6v12a2 2 0 0 0 2 2h14v-4"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>资产</button>
      <button class="tab" data-tab="me"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>我的</button>
    </nav>
  </div>

  <div class="subs" id="subs"></div>

  <div class="rec" id="rec" data-type="expense" role="dialog" aria-modal="true" aria-label="记一笔" aria-hidden="true" inert>
    <div class="rec-h">
      <button class="icon-btn" id="recClose" aria-label="关闭"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      <div class="seg" id="recSeg" role="tablist" aria-label="类型"><span class="knob"></span><button data-v="expense" class="on" role="tab" aria-selected="true">支出</button><button data-v="income" role="tab" aria-selected="false">收入</button><button data-v="transfer" role="tab" aria-selected="false">转账</button></div>
      <div style="width:38px"></div>
    </div>
    <div class="cats" id="cats"></div>
    <div class="rec-bottom">
      <div class="amount-line">
        <span class="lbl" id="selLbl"></span>
        <div class="amount-disp num zero" id="amountDisp" aria-live="polite"><span class="expr" id="exprLine"></span><span class="cur" id="recCur">¥</span><span class="val">0.00</span></div>
      </div>
      <div class="meta">
        <label class="date-chip"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span id="dateLbl">今天</span><input type="date" id="dateIn" aria-label="日期" /></label>
        <button class="date-chip acct-chip" id="acctChip"></button>
        <div class="note-in"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><input id="noteIn" maxlength="30" placeholder="添加备注" aria-label="备注" enterkeyhint="done" /></div>
      </div>
      <div class="keypad" id="keypad"></div>
    </div>
  </div>

  <div class="mask" id="mask"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true"><div class="grab" aria-hidden="true"></div><div id="sheetBody"></div></div>
  <div class="ob hide" id="ob" aria-hidden="true"></div>
  <div class="lock" id="lock" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="banner" id="banner" role="alert" aria-hidden="true"></div>
  <input type="file" id="fileIn" accept=".json,.csv,application/json,text/csv" hidden />
</div>
<noscript><div style="padding:40px 24px;font:15px/1.7 system-ui">小账本需要启用 JavaScript 才能运行。</div></noscript>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
