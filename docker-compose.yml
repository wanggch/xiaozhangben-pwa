# 小账本 · Docker Compose（Node 服务 + Caddy 自动 HTTPS + 每日备份）
# 用法：
#   在 .env 中设置 DOMAIN（见 .env.example 末尾；compose 只读取 DOMAIN/HTTP_PORT/HTTPS_PORT/XZB_PUBLIC_ORIGIN 等少数变量）
#   docker compose up -d --build
#   docker compose exec app node dist/cli.js create-user you@example.com --admin
services:
  app:
    build: .
    image: xiaozhangben:latest
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: ${XZB_PUBLIC_ORIGIN:-https://${DOMAIN:?请在 .env 中设置 DOMAIN}}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      # 只有 caddy 能访问 app（端口不对外暴露），信任 compose 内网的代理头
      TRUST_PROXY: ${TRUST_PROXY:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - data:/data
    expose:
      - "8787"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      UPSTREAM: app:8787
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: xiaozhangben:latest
    restart: unless-stopped
    depends_on: [app]
    volumes:
      - data:/data
    # 每 24 小时在线备份一次，保留 14 天（备份在 data 卷的 backups/ 目录）
    entrypoint: ["sh", "-c", "while :; do node dist/cli.js backup --dir /data/backups --keep-days 14; sleep 86400; done"]
    healthcheck:
      disable: true

volumes:
  data:
  caddy_data:
  caddy_config:
